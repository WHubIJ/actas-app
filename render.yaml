services:
  - type: web
    name: actas-app-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Valores reales: pegar desde backend/.env (nunca commitear aquí).
      - key: MISTRAL_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_STORAGE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
