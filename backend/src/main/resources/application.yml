spring:
  application:
    name: actas-app-backend

  # Carga backend/.env si existe (está en .gitignore). Spring Boot NO lee ficheros
  # .env por su cuenta: sin esta línea, "mvn spring-boot:run" arrancaría con los
  # valores por defecto de abajo (localhost) en vez de contra Supabase.
  # "optional:" evita que falle el arranque en entornos sin .env (CI, producción,
  # donde las credenciales llegan como variables de entorno reales).
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Credenciales de Supabase (Postgres). No commitear valores reales:
    # usar variables de entorno o un application-local.yml ignorado por git.
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/actas_app}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update # cambiar a "validate" cuando haya migraciones formales (Flyway/Liquibase)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

# Claves externas (Whisper/OpenAI, Supabase Storage, Firebase Cloud Messaging).
# Definir como variables de entorno, nunca hardcodeadas.
actas-app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    whisper-model: whisper-1
  supabase:
    storage-url: ${SUPABASE_STORAGE_URL:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:audios-reuniones}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  # Iglesia a la que se asignan las reuniones mientras no exista autenticación.
  # Cuando llegue la épica de auth, este valor sale del usuario autenticado y
  # esta propiedad desaparece.
  iglesia-por-defecto: ${IGLESIA_POR_DEFECTO:Iglesia sin asignar}
  enlace-compartido:
    expiracion-horas: 24
  transcripcion:
    max-reintentos: 3
  grabacion:
    duracion-maxima-minutos: 120
