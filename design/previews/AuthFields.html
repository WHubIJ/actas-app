<!doctype html>
<html lang="es" data-theme="light">
<head><meta name="viewport" content="width=device-width"><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');
:root, [data-theme="light"]{--bg: #F8F8F6;--surface: #FFFFFF;--surface-2: #F3F3F0;--text: #171716;--text-2: #6F6F6B;--text-3: #9A9A95;--border: #E5E5E0;--border-strong: #D4D4CE;--fill-hover: rgba(23,23,22,0.045);--fill-press: rgba(23,23,22,0.08);--scrim: rgba(11,11,13,0.32);--brand: #6857D9;--brand-strong: #493BA8;--brand-soft: #EEEAFE;--on-brand: #FFFFFF;--highlight: rgba(104,87,217,0.16);--success: #2A7444;--success-soft: #E6F4EB;--warning: #9A5B00;--warning-soft: #FBF1E1;--danger: #C8352B;--danger-soft: #FCEBE9;--shadow-sm: 0 1px 2px rgba(23,23,22,0.06);--shadow-md: 0 1px 2px rgba(23,23,22,0.04), 0 8px 24px rgba(23,23,22,0.08);--shadow-lg: 0 2px 4px rgba(23,23,22,0.04), 0 24px 64px rgba(23,23,22,0.14);color-scheme:light}
[data-theme="dark"]{--bg: #0B0B0D;--surface: #151518;--surface-2: #1D1D21;--text: #F5F5F2;--text-2: #A1A1A0;--text-3: #6F6F70;--border: #2A2A2E;--border-strong: #3A3A40;--fill-hover: rgba(245,245,242,0.06);--fill-press: rgba(245,245,242,0.10);--scrim: rgba(0,0,0,0.6);--brand: #8B7CFF;--brand-strong: #B2A8FF;--brand-soft: #221E3A;--on-brand: #0B0B0D;--highlight: rgba(139,124,255,0.24);--success: #5BC488;--success-soft: #11281A;--warning: #E8A23A;--warning-soft: #2B1F0B;--danger: #FF6B5E;--danger-soft: #2E1412;--shadow-sm: 0 1px 2px rgba(0,0,0,0.5);--shadow-md: 0 1px 2px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05);--shadow-lg: 0 2px 4px rgba(0,0,0,0.5), 0 24px 64px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.06);color-scheme:dark}
:root{--space-1: 4px;--space-2: 8px;--space-3: 12px;--space-4: 16px;--space-5: 20px;--space-6: 24px;--space-8: 32px;--space-10: 40px;--space-12: 48px;--space-16: 64px;--space-24: 96px;--radius-xs: 4px;--radius-sm: 7px;--radius-md: 10px;--radius-lg: 14px;--radius-xl: 20px;--radius-full: 999px;--control-sm: 28px;--control-md: 36px;--control-lg: 44px;--icon-sm: 16px;--icon-md: 20px;--sidebar-w: 244px;--topbar-h: 52px;--content-max: 1080px;--touch-min: 44px;--tabbar-h: 84px;--bp-mobile: 640px;--bp-tablet: 1024px;--dur-instant: 90ms;--dur-fast: 160ms;--dur-base: 240ms;--dur-slow: 400ms;--ease-standard: cubic-bezier(0.2, 0, 0, 1);--ease-exit: cubic-bezier(0.4, 0, 1, 1);--ease-linear: linear;--font-sans: "Geist", "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;--font-mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, monospace;}
.display{font-family:var(--font-sans);font-size:56px;line-height:60px;font-weight:600;letter-spacing:-0.035em;}
.heading{font-family:var(--font-sans);font-size:32px;line-height:38px;font-weight:600;letter-spacing:-0.025em;}
.title{font-family:var(--font-sans);font-size:22px;line-height:28px;font-weight:600;letter-spacing:-0.015em;}
.title-sm{font-family:var(--font-sans);font-size:17px;line-height:24px;font-weight:600;letter-spacing:-0.01em;}
.body-lg{font-family:var(--font-sans);font-size:17px;line-height:27px;font-weight:400;letter-spacing:-0.005em;}
.body{font-family:var(--font-sans);font-size:15px;line-height:22px;font-weight:400;}
.body-strong{font-family:var(--font-sans);font-size:15px;line-height:22px;font-weight:500;}
.caption{font-family:var(--font-sans);font-size:13px;line-height:18px;font-weight:400;}
.label{font-family:var(--font-sans);font-size:13px;line-height:16px;font-weight:500;}
.overline{font-family:var(--font-sans);font-size:11px;line-height:14px;font-weight:600;letter-spacing:0.06em;}
.metadata{font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:400;letter-spacing:0;}
.metadata-strong{font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:500;letter-spacing:0;}

/* MeetingAI · componentes. Valores desde tokens.css; aquí solo composición. */

/* ── Marca: los componentes leen --accent*, que apunta a brand ────────── */
:root, [data-theme] { --accent: var(--brand); --accent-strong: var(--brand-strong); --accent-soft: var(--brand-soft); --on-accent: var(--on-brand); }

/* ── Base ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); font-size: 15px; line-height: 22px; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
[data-theme] { color: var(--text); }
.ma-ground { background: var(--bg); color: var(--text); }
.ma-muted { color: var(--text-2); }
.ma-faint { color: var(--text-3); }
.ma-accent-text { color: var(--accent-strong); }
.ma-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ma-ico { width: var(--icon-md); height: var(--icon-md); flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ma-ico-sm { width: var(--icon-sm); height: var(--icon-sm); }
.ma-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.ma-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.ma-demo { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
.ma-hr { height: 1px; background: var(--border); border: 0; margin: 0; }
.ma-kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; min-width: 18px; padding: 0 5px; border-radius: var(--radius-xs); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); text-align: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Botones ──────────────────────────────────────────────────────────── */
.ma-btn { --h: var(--control-md); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--h); padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; font: 500 14px/1 var(--font-sans); letter-spacing: -0.005em; cursor: pointer; white-space: nowrap; transition: background var(--dur-instant) var(--ease-standard), border-color var(--dur-instant) var(--ease-standard), transform var(--dur-instant) var(--ease-standard); }
.ma-btn:active { transform: scale(0.98); }
.ma-btn .ma-ico { width: 18px; height: 18px; }
.ma-btn-sm { --h: var(--control-sm); padding: 0 var(--space-3); font-size: 13px; border-radius: var(--radius-sm); gap: 6px; }
.ma-btn-sm .ma-ico { width: 16px; height: 16px; }
.ma-btn-lg { --h: var(--control-lg); padding: 0 var(--space-5); font-size: 15px; border-radius: 12px; }
.ma-btn-primary { background: var(--accent); color: var(--on-accent); }
.ma-btn-primary:hover { background: var(--accent-strong); }
[data-theme="dark"] .ma-btn-primary:hover, [data-theme="dark"].ma-btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.ma-btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.ma-btn-secondary:hover { background: var(--surface-2); }
.ma-btn-ghost { background: transparent; color: var(--text); }
.ma-btn-ghost:hover { background: var(--fill-hover); }
.ma-btn-ai { background: var(--accent-soft); color: var(--accent-strong); }
.ma-btn-ai:hover { background: var(--fill-press); }
.ma-btn-danger { background: transparent; color: var(--danger); border-color: var(--border-strong); }
.ma-btn-danger:hover { background: var(--danger-soft); }
.ma-btn[disabled] { opacity: 0.4; pointer-events: none; }
.ma-btn-icon { width: var(--h); padding: 0; }

/* ── Inputs ───────────────────────────────────────────────────────────── */
.ma-field { display: flex; flex-direction: column; gap: 6px; min-width: 240px; }
.ma-field > label { font-size: 13px; line-height: 16px; font-weight: 500; color: var(--text); }
.ma-field > .ma-help { font-size: 13px; line-height: 18px; color: var(--text-2); }
.ma-field.is-error > .ma-help { color: var(--danger); }
.ma-input { display: flex; align-items: center; gap: var(--space-2); height: var(--control-md); padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 400 14px/1 var(--font-sans); transition: border-color var(--dur-instant), box-shadow var(--dur-fast); }
.ma-input input { all: unset; flex: 1; min-width: 0; font: inherit; color: var(--text); }
.ma-input input::placeholder, .ma-input .ma-ph { color: var(--text-3); }
.ma-input .ma-ico { color: var(--text-2); width: 18px; height: 18px; }
.ma-input.is-focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ma-field.is-error .ma-input { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.ma-input-search { background: var(--surface-2); border-color: transparent; }
.ma-textarea { height: auto; min-height: 88px; padding: 10px var(--space-3); align-items: flex-start; line-height: 20px; }
.ma-switch { width: 32px; height: 20px; border-radius: var(--radius-full); background: var(--border-strong); position: relative; flex: none; transition: background var(--dur-fast) var(--ease-standard); }
.ma-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform var(--dur-fast) var(--ease-standard); }
.ma-switch.is-on { background: var(--accent); }
.ma-switch.is-on::after { transform: translateX(12px); }
.ma-select { justify-content: space-between; cursor: pointer; }

/* ── Tabs ─────────────────────────────────────────────────────────────── */
.ma-seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-2); border-radius: var(--radius-md); }
.ma-seg > * { height: 30px; padding: 0 var(--space-3); display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; font: 500 13px/1 var(--font-sans); color: var(--text-2); cursor: pointer; }
.ma-seg > .is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
[data-theme="dark"] .ma-seg > .is-active { background: var(--border); }
.ma-tabs { display: flex; gap: var(--space-6); border-bottom: 1px solid var(--border); }
.ma-tabs > * { position: relative; padding: 10px 0 12px; font: 500 14px/20px var(--font-sans); color: var(--text-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.ma-tabs > .is-active { color: var(--text); }
.ma-tabs > .is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.ma-tabs .ma-count { font: 400 12px/16px var(--font-mono); color: var(--text-3); }

/* ── Superficies ──────────────────────────────────────────────────────── */
.ma-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); }
.ma-card-hover:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.ma-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.ma-section-title { white-space: nowrap; font: 600 11px/14px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); }

/* ── Shell de aplicación (idéntico en las tres apps) ─────────────────── */
.ma-app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100%; min-height: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
.ma-sidebar { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-3) var(--space-3) var(--space-4); border-right: 1px solid var(--border); min-height: 0; background: var(--bg); }
.ma-nav-group { display: flex; flex-direction: column; gap: 1px; margin-top: var(--space-4); }
.ma-nav-group > .ma-section-title { padding: 0 var(--space-2) var(--space-2); color: var(--text-3); }
.ma-nav-item { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 var(--space-2); border-radius: var(--radius-sm); font: 500 13.5px/1 var(--font-sans); color: var(--text-2); cursor: pointer; }
.ma-nav-item .ma-ico { width: 18px; height: 18px; }
.ma-nav-item:hover { background: var(--fill-hover); color: var(--text); }
.ma-nav-item.is-active { background: var(--fill-press); color: var(--text); }
.ma-nav-item.is-active .ma-ico { color: var(--accent); }
.ma-nav-item .ma-meta { margin-left: auto; font: 400 11px/1 var(--font-mono); color: var(--text-3); }
.ma-nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: auto; }
.ma-sidebar-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: var(--space-2); border-radius: var(--radius-sm); font-size: 13px; line-height: 16px; }
.ma-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ma-topbar { height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-5) 0 var(--space-6); border-bottom: 1px solid var(--border); }
.ma-crumb { display: flex; align-items: center; gap: var(--space-2); font: 500 13.5px/1 var(--font-sans); color: var(--text-2); }
.ma-crumb b { color: var(--text); font-weight: 500; }
.ma-topbar .ma-spacer { flex: 1; }

/* ── Suite switcher ───────────────────────────────────────────────────── */
.ma-switcher { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 var(--space-2); border-radius: var(--radius-md); cursor: pointer; }
.ma-switcher:hover { background: var(--fill-hover); }
.ma-switcher .ma-appicon { width: 24px; height: 24px; }
.ma-switcher-name { font: 600 14px/1 var(--font-sans); letter-spacing: -0.01em; }
.ma-switcher-name span { color: var(--text-3); font-weight: 500; }
.ma-switcher .ma-ico { margin-left: auto; width: 16px; height: 16px; color: var(--text-3); }
.ma-suite-menu { width: 300px; padding: 6px; }
.ma-suite-item { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: var(--space-3); padding: 8px; border-radius: var(--radius-md); cursor: pointer; }
.ma-suite-item:hover { background: var(--fill-hover); }
.ma-suite-item .ma-appicon { width: 32px; height: 32px; }
.ma-suite-item b { display: block; font: 600 14px/18px var(--font-sans); }
.ma-suite-item small { display: block; font-size: 12.5px; line-height: 16px; color: var(--text-2); }
.ma-suite-item.is-current { background: var(--fill-press); }
.ma-suite-item .ma-ico { color: var(--text-2); width: 16px; height: 16px; }
.ma-appicon { display: block; flex: none; }

/* ── Popovers: menú, tooltip, toast, modal ────────────────────────────── */
.ma-popover { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
.ma-menu { min-width: 220px; padding: 4px; }
.ma-menu-item { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 var(--space-2); border-radius: var(--radius-sm); font: 400 13.5px/1 var(--font-sans); color: var(--text); cursor: pointer; }
.ma-menu-item .ma-ico { width: 16px; height: 16px; color: var(--text-2); }
.ma-menu-item .ma-kbd { margin-left: auto; }
.ma-menu-item.is-hover { background: var(--fill-hover); }
.ma-menu-item.is-danger, .ma-menu-item.is-danger .ma-ico { color: var(--danger); }
.ma-menu-item.is-ai .ma-ico { color: var(--accent); }
.ma-menu-sep { height: 1px; background: var(--border); margin: 4px 6px; }
.ma-menu-label { padding: 8px 8px 4px; font: 600 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.ma-tooltip { display: inline-flex; align-items: center; gap: var(--space-2); padding: 6px 10px; border-radius: var(--radius-sm); background: var(--text); color: var(--bg); font: 500 12.5px/16px var(--font-sans); box-shadow: var(--shadow-md); }
.ma-tooltip .ma-kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .7; }
.ma-toast { display: flex; align-items: center; gap: var(--space-3); min-width: 340px; padding: 12px 12px 12px 14px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-md); font-size: 14px; line-height: 20px; }
.ma-toast .ma-toast-body { flex: 1; }
.ma-toast small { display: block; color: var(--text-2); font-size: 13px; line-height: 18px; }
.ma-toast .ma-ico { color: var(--accent); }
.ma-toast.is-success > .ma-ico { color: var(--success); }
.ma-toast.is-error > .ma-ico { color: var(--danger); }
.ma-modal-scrim { background: var(--scrim); display: grid; place-items: center; padding: var(--space-10); }
.ma-modal { width: 460px; max-width: 100%; background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
.ma-modal h3 { margin: 0; font: 600 17px/24px var(--font-sans); letter-spacing: -0.01em; }
.ma-modal p { margin: 4px 0 0; color: var(--text-2); font-size: 14px; line-height: 21px; }
.ma-modal-foot { display: flex; justify-content: flex-end; gap: var(--space-2); }

/* ── Badges y avatares ────────────────────────────────────────────────── */
.ma-badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: var(--radius-full); font: 500 12px/1 var(--font-sans); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.ma-badge .ma-ico { width: 13px; height: 13px; stroke-width: 2; }
.ma-badge-accent { background: var(--accent-soft); color: var(--accent-strong); }
.ma-badge-success { background: var(--success-soft); color: var(--success); }
.ma-badge-warning { background: var(--warning-soft); color: var(--warning); }
.ma-badge-danger { background: var(--danger-soft); color: var(--danger); }
.ma-badge-outline { background: transparent; box-shadow: inset 0 0 0 1px var(--border-strong); }
.ma-badge-mono { font-family: var(--font-mono); font-weight: 500; letter-spacing: .02em; }
.ma-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.ma-avatar { --s: 28px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--text-2); font: 600 11px/1 var(--font-sans); letter-spacing: .01em; box-shadow: inset 0 0 0 1px var(--border); }
.ma-avatar-sm { --s: 22px; font-size: 9.5px; }
.ma-avatar-lg { --s: 40px; font-size: 14px; }
.ma-avatar.is-speaking { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); color: var(--text); }
.ma-avatars { display: flex; }
.ma-avatars > .ma-avatar { box-shadow: 0 0 0 2px var(--bg); margin-left: -6px; }
.ma-avatars > .ma-avatar:first-child { margin-left: 0; }

/* ── IA: acciones, contenido generado, sugerencias ────────────────────── */
.ma-ai-mark { width: 16px; height: 16px; flex: none; color: var(--accent); fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.ma-smart { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); font: 500 13px/1 var(--font-sans); color: var(--text); cursor: pointer; transition: border-color var(--dur-instant), background var(--dur-instant); }
.ma-smart:hover { border-color: var(--accent); }
.ma-smart .ma-ico { width: 16px; height: 16px; color: var(--accent); }
.ma-generated { position: relative; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); padding: var(--space-5); }
.ma-generated-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); font: 500 12px/16px var(--font-sans); color: var(--accent-strong); }
.ma-generated-head .ma-meta { margin-left: auto; color: var(--text-3); font: 400 12px/16px var(--font-mono); }
.ma-suggest { display: flex; align-items: center; gap: var(--space-3); padding: 10px 10px 10px 14px; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--text); font-size: 13.5px; line-height: 18px; }
.ma-suggest > span { flex: 1; }
.ma-suggest b { font-weight: 500; color: var(--accent-strong); }
.ma-ai-steps { display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; line-height: 18px; }
.ma-ai-steps > div { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
.ma-ai-steps .is-done { color: var(--text); }
.ma-ai-steps .is-done .ma-ico { color: var(--accent); }
.ma-ai-steps .is-now { color: var(--text); font-weight: 500; }
.ma-ai-steps .is-wait { color: var(--text-3); }
.ma-ai-steps .ma-ico { width: 16px; height: 16px; }

/* Shimmer de generación: líneas cápsula que se escriben */
.ma-gen-lines { display: flex; flex-direction: column; gap: 10px; }

<div class="ma-stack" style="gap:12px"><div class="ma-section-title">Fuerza de contraseña</div><div class="ma-stack" style="gap:6px"><div class="ma-strength is-2"><i></i><i></i><i></i><i></i></div><span class="caption" style="color:var(--warning)">Débil · usa 10 caracteres o más</span></div><div class="ma-stack" style="gap:6px"><div class="ma-strength is-3"><i></i><i></i><i></i><i></i></div><span class="caption" style="color:var(--warning)">Buena · añade un símbolo</span></div><div class="ma-stack" style="gap:6px"><div class="ma-strength is-4"><i></i><i></i><i></i><i></i></div><span class="caption" style="color:var(--success)">Fuerte</span></div><div class="ma-steps" style="margin-top:6px"><i class="is-done"></i><i></i>Paso 1 de 2</div></div>
